[package]
name = "bevy-editor"
version = "0.1.0"
edition = "2021"
authors = ["salom600"]
description = "A complete game engine editor built on top of the Bevy engine with bevy_egui"
license = "MIT OR Apache-2.0"
repository = "https://github.com/salom600/engin1"
homepage = "https://github.com/salom600/engin1"
keywords = ["gamedev", "bevy", "editor", "engine", "gui"]
categories = ["game-engines", "gui", "development-tools"]
readme = "README.md"
exclude = ["/.github", "/target"]

[dependencies]
# Core engine - Bevy 0.14 (stable, well-documented)
bevy = { version = "0.14", features = [
    "animation",
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_gltf",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "jpeg",
    "hdr",
    "ktx2",
    "zstd",
    "vorbis",
    "wav",
    "mp3",
    "flac",
    "symphonia-all",
    "tonemapping_luts",
    "x11",
    "wayland",
    "bevy_gizmos",
] }

# bevy_egui - Immediate-mode GUI for editor panels
bevy_egui = "0.28"

# Physics engine (3D) - Rapier3D integration
bevy_rapier3d = { version = "0.27", features = ["serde-serialize"] }

# Inspector for component reflection
bevy-inspector-egui = { version = "0.25", features = ["bevy_pbr"] }

# Picking - entity selection in viewport
bevy_mod_picking = { version = "0.20", default-features = false, features = ["backend_raycast", "backend_egui", "backend_sprite"] }

# Transform gizmo for viewport manipulation
bevy_transform_gizmo = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
toml = "0.8"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
once_cell = "1.20"
parking_lot = "0.12"
rand = "0.8"

# Native file dialog
rfd = "0.14"

# Open URLs / files in the system default app
open = "5.3"

# Egui extras
egui = "0.28"
egui_dock = "0.13"
egui_extras = { version = "0.28", features = ["all_loaders"] }
egui_file = "0.17"

[features]
default = [
    "bevy/wayland",
    "bevy/x11",
]
dynamic = ["bevy/dynamic_linking"]
production = []
dev = []

# Minimize binary size on release
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
incremental = false

[profile.dev]
opt-level = 1
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 3

# Faster CI builds
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false
