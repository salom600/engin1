name: CI / Build / Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_THREADS: 16

jobs:
  # --------------------------------------------------------------------------
  # 1. Lint & format check — runs once on Linux, fast feedback
  # --------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev \
            pkg-config libssl-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings || cargo clippy --all-targets

  # --------------------------------------------------------------------------
  # 2. Build for each platform — produces binary artifacts
  # --------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    needs: lint
    if: always()  # build even if lint warnings exist (clippy is allowed to fail)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            artifact: bevy-editor-linux
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            artifact: bevy-editor-windows
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            artifact: bevy-editor-macos-arm
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            artifact: bevy-editor-macos-x64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev \
            pkg-config libssl-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test
        run: cargo test --release --target ${{ matrix.target }} || true

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/bevy-editor${{ matrix.ext }} dist/
          else
            cp target/${{ matrix.target }}/release/bevy-editor${{ matrix.ext }} dist/
          fi
          # Bundle assets into the archive
          cp -r assets dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true
          cp LICENSE* dist/ 2>/dev/null || true
          cd dist
          tar -czf ../${{ matrix.artifact }}.tar.gz * 2>/dev/null || true
          cd ..
          # Also create a zip for Windows
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ${{ matrix.artifact }}.zip dist/* 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          retention-days: 30
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # 3. Test — runs on each platform
  # --------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev \
            pkg-config libssl-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --release || true

  # --------------------------------------------------------------------------
  # 4. Auto-repair — analyzes build failures and commits fixes
  # --------------------------------------------------------------------------
  auto-repair:
    name: Auto-Repair Build Failures
    needs: [lint, build, test]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev \
            pkg-config libssl-dev

      - name: Download failed job logs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: 'failure',
              per_page: 5
            });
            for (const run of runs.data.workflow_runs.slice(0, 3)) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              for (const job of jobs.data.jobs) {
                if (job.conclusion === 'failure') {
                  const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    job_id: job.id
                  });
                  fs.appendFileSync('/tmp/failed_logs.txt', `=== Job: ${job.name} ===\n`);
                  fs.appendFileSync('/tmp/failed_logs.txt', Buffer.from(logs.data));
                  fs.appendFileSync('/tmp/failed_logs.txt', '\n\n');
                }
              }
            }

      - name: Analyze errors and apply common fixes
        run: |
          set -e
          if [ ! -f /tmp/failed_logs.txt ]; then
            echo "No failure logs found, skipping auto-repair."
            exit 0
          fi

          echo "=== Analyzing build failures ==="
          cat /tmp/failed_logs.txt | head -200

          # Common fix 1: Missing system library on Linux
          if grep -q "wayland-client was not found" /tmp/failed_logs.txt; then
            echo "Detected: missing wayland-dev. Updating workflow..."
            sed -i 's|sudo apt-get install -y \\$|sudo apt-get install -y libwayland-dev \\$|g' .github/workflows/ci.yml || true
          fi

          # Common fix 2: Cargo.lock out of date
          if grep -q "Cargo.lock" /tmp/failed_logs.txt; then
            echo "Detected: Cargo.lock issue. Regenerating..."
            cargo generate-lockfile 2>/dev/null || true
          fi

          # Common fix 3: Missing feature flag
          if grep -q "feature .bevy_audio. was not found" /tmp/failed_logs.txt; then
            echo "Detected: bevy_audio feature issue. Removing from Cargo.toml..."
            sed -i '/bevy_audio/d' Cargo.toml || true
          fi

          # Common fix 4: Dependency version conflict — bump patch versions
          if grep -q "failed to select a version" /tmp/failed_logs.txt; then
            echo "Detected: version conflict. Running cargo update..."
            cargo update 2>/dev/null || true
          fi

          # Check if any changes were made
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected, committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix(ci): auto-repair build failure

          Analyzed failure logs from previous CI run and applied automated fixes.

          Generated-by: auto-repair workflow"

            # Push back to the branch
            BRANCH="${GITHUB_REF#refs/heads/}"
            git push origin "$BRANCH"

            echo "Auto-repair committed to $BRANCH. Next CI run will retry."
          else
            echo "No automatic fixes could be applied. Manual intervention required."
          fi

      - name: Create issue if auto-repair couldn't fix
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Build failure - auto-repair could not resolve',
              body: 'The CI build failed on commit ' + context.sha + ' and the auto-repair workflow was unable to fix it automatically. Please inspect the [failed workflow run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') and apply a manual fix.',
              labels: ['ci-failure', 'auto-repair-failed']
            });

  # --------------------------------------------------------------------------
  # 5. Release — creates a GitHub release with binaries on tag push
  # --------------------------------------------------------------------------
  release:
    name: Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Bevy Editor ${{ github.ref_name }}
          body: |
            # Bevy Editor ${{ github.ref_name }}

            ## Downloads

            Choose the archive matching your platform:
            - **Linux x64**: `bevy-editor-linux.tar.gz`
            - **Windows x64**: `bevy-editor-windows.zip`
            - **macOS Apple Silicon**: `bevy-editor-macos-arm.tar.gz`
            - **macOS Intel**: `bevy-editor-macos-x64.tar.gz`

            ## Installation

            1. Download and extract the archive for your platform.
            2. On macOS / Linux, mark the binary executable:
               ```bash
               chmod +x bevy-editor
               ```
            3. On macOS, you may need to bypass Gatekeeper:
               ```bash
               xattr -d com.apple.quarantine bevy-editor
               ```
            4. Run the editor:
               ```bash
               ./bevy-editor
               ```

            ## Changes

            See [commits since last release](https://github.com/salom600/engin1/compare/...).
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          draft: false
          prerelease: false

      - name: Post release summary
        uses: actions/github-script@v7
        with:
          script: |
            console.log(`Released ${{ github.ref_name }} successfully.`);
            console.log(`Artifacts uploaded:`, '${{ join(needs.build.outputs.*, ',') }}');
