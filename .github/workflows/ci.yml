name: CI / Build / Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 5
  RUSTUP_MAX_THREADS: 16
  DEBIAN_FRONTEND: noninteractive

jobs:
  # --------------------------------------------------------------------------
  # 1. Lint & format check — fast feedback, runs once on Linux
  # --------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies (with timeout)
        run: |
          timeout 120 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
          timeout 120 sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev \
            pkg-config libssl-dev || true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-
          fail-on-cache-miss: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (allow warnings)
        run: cargo clippy --all-targets || true

  # --------------------------------------------------------------------------
  # 2. Build for each platform — produces binary artifacts
  # --------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            artifact: bevy-editor-linux
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            artifact: bevy-editor-windows
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            artifact: bevy-editor-macos-arm
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            artifact: bevy-editor-macos-x64
            ext: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies (with timeout)
        if: runner.os == 'Linux'
        run: |
          timeout 120 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
          timeout 120 sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev \
            pkg-config libssl-dev || true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-
          fail-on-cache-miss: false

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bevy-editor${{ matrix.ext }} dist/ 2>/dev/null || true
          cp -r assets dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true
          cp LICENSE* dist/ 2>/dev/null || true
          cd dist
          tar -czf ../${{ matrix.artifact }}.tar.gz * 2>/dev/null || true
          cd ..
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ${{ matrix.artifact }}.zip dist/* 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          retention-days: 30
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # 3. Release — creates a GitHub release with binaries on tag push
  # --------------------------------------------------------------------------
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Bevy Editor ${{ github.ref_name }}
          body: |
            # Bevy Editor ${{ github.ref_name }}

            ## Downloads

            - **Linux x64**: `bevy-editor-linux.tar.gz`
            - **Windows x64**: `bevy-editor-windows.zip`
            - **macOS Apple Silicon**: `bevy-editor-macos-arm.tar.gz`
            - **macOS Intel**: `bevy-editor-macos-x64.tar.gz`
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          draft: false
          prerelease: false
