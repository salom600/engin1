name: Build Monitor

on:
  schedule:
    # Run every 6 hours to check that the main branch still builds
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  monitor:
    name: Check Build Status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (with timeout)
        run: |
          timeout 120 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
          timeout 120 sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev \
            pkg-config libssl-dev || true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: monitor-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify build
        id: verify
        run: |
          if cargo check --message-format=short 2>&1 | tee /tmp/build.log; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "BUILD_OK=true" >> $GITHUB_ENV
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "BUILD_OK=false" >> $GITHUB_ENV
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/build.log')
              ? fs.readFileSync('/tmp/build.log', 'utf8').slice(-2000)
              : '(no log captured)';

            // Look for an existing open issue with the same title
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-monitor'
            });

            const title = 'Scheduled build check failed';
            const existing = issues.data.find(i => i.title === title);

            const body = `## Scheduled build check failed

            The scheduled build verification failed on commit ${context.sha}.

            ### Build log (last 2000 chars)

            \`\`\`
            ${log}
            \`\`\`

            ### Action required

            Inspect the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) and apply a fix.
            `;

            if (existing) {
              // Add a comment to the existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              // Create a new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['build-monitor', 'ci-failure']
              });
            }

      - name: Close issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-monitor'
            });

            for (const issue of issues.data) {
              if (issue.title === 'Scheduled build check failed') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Build is now passing on commit ${context.sha}. Closing.`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }
